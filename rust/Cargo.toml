[package]
name = "dsh-hdfs-native"
version = "0.1.0"
edition = "2021"
description = "napi-rs native addon exposing hdfs-native to the dsh-hdfs plugin"
license = "Apache-2.0"

[lib]
name = "dsh_hdfs_native"
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["napi8", "tokio_rt"] }
napi-derive = { version = "3" }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
bytes = "1"
hdfs-native = "0.11.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Kerberos: 纯 Rust 实现，免 MIT kinit / 系统 gssapi。
# hdfs-native 的 SASL/GSS 走 libloading 加载 libgssapi_krb5（Windows 上找不到），
# 因此这里用 kerbeiros 直接取 TGT 并写 ccache，再让 hdfs-native 从 ccache 读取凭证。
kerberos-asn1 = { version = "0.4.2", package = "awol2005ex3-kerberos-asn1" }
kerberos-crypto = { version = "0.4.1", package = "awol2005ex3-kerberos-crypto" }
kerberos-ccache = { version = "0.4.1", package = "awol2005ex3-kerberos-ccache" }
kerberos-keytab = { version = "0.4.1", package = "awol2005ex3-kerberos-keytab" }
kerbeiros = { version = "0.4.1", package = "awol2005ex3-kerbeiros" }
kinit-kt = { version = "0.1.0", package = "awol2005ex3-kinit-kt" }

# 本地 vendored 的 hdfs-native：只改了一处 —— Windows 上优先加载 `gssapi64.dll`
# （MIT Kerberos for Windows 的真名），`gssapi_krb5.dll` 仅作回退。
# 原因：Windows 按模块基名去重，若同进程里还有别的插件（dsh-offexplorer 的
# librdkafka MIT provider）加载 `gssapi64.dll`，两份映像会共享同一套
# krb5_64.dll / k5sprt64.dll，两遍 GSSAPI 初始化会在 k5_key_register() 里触发
# MIT krb5 `threads.c` 的 `assert(destructors_set[keynum] == 0)`。
# 升级 hdfs-native 时务必把 vendor 里的这个补丁带上。
[patch.crates-io]
hdfs-native = { path = "vendor/hdfs-native" }

[profile.release]
lto = true
codegen-units = 1
strip = true
